<!doctype html>
<html lang="en">

<head>

    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Beautiful Places in India</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #eef5ee;
            font-family: Arial, sans-serif;
        }



        .carousel-item img {
            height: 450px;
            object-fit: cover;
        }

        .carousel {
            border-radius: 10px;
            overflow: hidden;
        }

        .carousel-caption {
            background-color: rgba(0, 0, 0, 0.55);
            padding: 15px;
            border-radius: 5px;
        }
    </style>

</head>


<body>




    <div class="container mt-5">

        <h1 class=" text-success  fw-bold text-center mb-2">
            Beautiful Places in India
        </h1>




        <div class="row justify-content-center">

            <div class="col-md-10">

                <div id="placesCarousel" class="carousel slide shadow" data-bs-ride="carousel">




                    <div class="carousel-indicators">

                        <button type="button" data-bs-target="#placesCarousel" data-bs-slide-to="0" class="active">
                        </button>

                        <button type="button" data-bs-target="#placesCarousel" data-bs-slide-to="1">
                        </button>

                        <button type="button" data-bs-target="#placesCarousel" data-bs-slide-to="2">
                        </button>

                        <button type="button" data-bs-target="#placesCarousel" data-bs-slide-to="3">
                        </button>

                        <button type="button" data-bs-target="#placesCarousel" data-bs-slide-to="4">
                        </button>

                    </div>




                    <div class="carousel-inner">




                        <div class="carousel-item active">

                            <img src="https://images.unsplash.com/photo-1564507592333-c60657eea523?auto=format&fit=crop&w=1200&q=80"
                                class="d-block w-100" alt="Taj Mahal">

                            <div class="carousel-caption">

                                <h3 class=".text-white">Taj Mahal</h3>

                                <p>
                                    Agra, Uttar Pradesh
                                </p>

                            </div>

                        </div>




                        <div class="carousel-item">

                            <img src="https://images.unsplash.com/photo-1602216056096-3b40cc0c9944?auto=format&fit=crop&w=1200&q=80"
                                class="d-block w-100" alt="Kerala">

                            <div class="carousel-caption">

                                <h3>Kerala</h3>

                                <p>
                                    Known for its beautiful backwaters and greenery.
                                </p>

                            </div>

                        </div>




                        <div class="carousel-item">

                            <img src="https://images.unsplash.com/photo-1477587458883-47145ed94245?auto=format&fit=crop&w=1200&q=80"
                                class="d-block w-100" alt="Jaipur">

                            <div class="carousel-caption">

                                <h3>Jaipur</h3>

                                <p>
                                    The Pink City famous for forts and palaces.
                                </p>

                            </div>

                        </div>




                        <div class="carousel-item">

                            <img src="https://images.unsplash.com/photo-1626621341517-bbf3d9990a23?auto=format&fit=crop&w=1200&q=80"
                                class="d-block w-100" alt="Kashmir">

                            <div class="carousel-caption">

                                <h3>Kashmir</h3>

                                <p>
                                    Famous for mountains, lakes and scenic landscapes.
                                </p>

                            </div>

                        </div>




                        <div class="carousel-item">

                            <img src="https://images.unsplash.com/photo-1512343879784-a960bf40e7f2?auto=format&fit=crop&w=1200&q=80"
                                class="d-block w-100" alt="Goa">

                            <div class="carousel-caption">

                                <h3>Goa</h3>

                                <p>
                                    Popular for beaches, nature and relaxed surroundings.
                                </p>

                            </div>

                        </div>


                    </div>




                    <button class="carousel-control-prev" type="button" data-bs-target="#placesCarousel"
                        data-bs-slide="prev">

                        <span class="carousel-control-prev-icon"></span>

                        <span class="visually-hidden">
                            Previous
                        </span>

                    </button>




                    <button class="carousel-control-next" type="button" data-bs-target="#placesCarousel"
                        data-bs-slide="next">

                        <span class="carousel-control-next-icon"></span>

                        <span class="visually-hidden">
                            Next
                        </span>

                    </button>


                </div>

            </div>

        </div>

    </div>




    <!-- Bootstrap JavaScript -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>


</body>

</html>
