<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nature Image Slider</title>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script src="https://code.jquery.com/ui/1.14.1/jquery-ui.min.js"></script>

    <style>
 */

        body {

            padding: 0;
            margin: 0;
            font-family:'Lucida Sans','Lucida Sans Regular','Lucida Grande','Lucida Sans Unicode',Geneva,Verdana,sans-serif;
            background-color: #E8F1F2;
        }

        header {
            font-size: 32px;
            font-family: sans-serif;
            background: #264653;
            color: white;
            text-align: center;
            box-sizing: border-box;
            padding: 22px;
            width: 60%;
            margin: 25px auto 45px;
            border-radius: 12px;
            box-shadow:0 6px 15px rgba(0, 0, 0, 0.25);
            letter-spacing: 2px;

        }

        #main {
            width: 100%;
            overflow: hidden;
        }

        .pic {
            text-align: center;
            width: 100%;
        }


        .pic img {
            width: 550px;
            height: 400px;
            object-fit: cover;
            margin: 10px auto;
            border-radius: 20px;
            display: block;
            box-shadow:0 8px 18px rgba(0, 0, 0, 0.25);
            border: 5px solid white;
            transition: 0.4s;

        }


        .pic img:hover {
            transform: scale(1.03);
            box-shadow:0 12px 25px rgba(0, 0, 0, 0.30);

        }
/

        .image-text {
            text-align: center;
            margin-top: 20px;
            color: #264653;
        }


        .image-text h2 {
            margin: 0;
            font-size: 28px;
        }


        .image-text p {

           margin-top: 8px;
            color: #52727c;
            font-size: 15px;
        }


        footer {
            background: #264653;
            color: white;
            text-align: center;
            padding: 22px;
            margin-top: 55px;
            font-size: 15px;
            letter-spacing: 1px;
            box-shadow:0 -4px 10px rgba(0, 0, 0, 0.15);

        }


        @media (max-width: 768px) {

            header {
                width: 90%;
                font-size: 25px;
                padding: 18px;
            }


           .pic img {
                width: 90%;
                height: 350px;
            }


           .image-text h2 {
                font-size: 23px;
            }

        }


        @media (max-width: 480px) {
            header {
                width: 94%;
                font-size: 21px;
            }


            .pic img {
                width: 88%;
                height: 280px;
            }


            .image-text p {
                font-size: 13px;
            }

        }

    </style>

</head>


<body>


    <header>
         Image Slider
    </header>



    <div id="main">
        <div class="pic" id="pic0">

            <img
                src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1200&q=80"
                alt="Beautiful Nature Landscape">

        </div>



    <script>

        var c = 0
        var t = 0
        $(document).ready(function()
        {
            setInterval(function runb()
            {
                $("#pic"+c).slideToggle(1000)

                if((c<=2)&&(t==0))
                {
                    c++
                }

                else
                {
                    t=1
                }

                if((c>=1)&&(t==1))
                {
                    c--
                }

                else
                {
                    t=0
                }

                document.title = c
            },3000)
        })
    </script>

    <footer>

        <div id="footer">

            © 2026 | Nature Image Slider

        </div>

    </footer>
</body>

</html>
