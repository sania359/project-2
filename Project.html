<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Projects</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }


        header {
            background: #076969;
            padding: 25px 8%;
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            color: white;
            font-size: 32px;
            letter-spacing: 2px;
        }

        .home-btn {
            position: absolute;
            right: 8%;
            text-decoration: none;
            color: #076969;
            background: white;
            padding: 12px 22px;
            border-radius: 6px;
            font-weight: bold;
            transition: 0.3s;
        }

        .home-btn:hover {
            background: #ffd500;
            color: #222;
        }

        /* PROJECT SECTION */
        .project-section {
            width: 85%;
            margin: 50px auto;
        }

        .project-section h2 {
            text-align: center;
            font-size: 35px;
            margin-bottom: 10px;
        }

        .project-section>p {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
        }

        /* PROJECT BOXES */
        .project-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .project-box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            transition: 0.3s;
        }

        .project-box:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        .project-box h3 {
            color: #076969;
            font-size: 23px;
            margin-bottom: 12px;
        }

        .project-box p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 20px;
        }


        .project-link {
            display: inline-block;
            text-decoration: none;
            background: #076969;
            color: white;
            padding: 10px 18px;
            border-radius: 5px;
            font-weight: bold;
            transition: 0.3s;
        }

        .project-link:hover {
            background: #ffd500;
            color: #222;
        }

        @media (max-width: 900px) {

            .project-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* MOBILE */
        @media (max-width: 600px) {

            header {
                padding: 20px;
            }

            header h1 {
                font-size: 25px;
            }

            .home-btn {
                padding: 9px 14px;
                font-size: 14px;
            }

            .project-section {
                width: 90%;
            }

            .project-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header>

        <h1>PROJECT WORK</h1>

        <a href="index.html" class="home-btn">
            ← Back
        </a>

    </header>


    <!-- PROJECT SECTION -->
    <section class="project-section">

        <div class="project-container">

            <!-- PROJECT 1 -->
            <div class="project-box">

                <h3>Arena Animation GTB Nager</h3>

                <p>
                    A modern and responsive website designed to showcase Arena Animation GTB Nagar, its courses,
                    facilities, events, and creative learning opportunities.
                </p>

                <a href="index1.html" class="project-link">
                    View Project →
                </a>

            </div>


            <!-- PROJECT 2 -->
            <div class="project-box">

                <h3> Sustainable Energy</h3>

                <p>

                </p>

                <a href="index2.html" class="project-link">
                    View Project →
                </a>

            </div>

        </div>

    </section>

</body>

</html>
