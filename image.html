<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<style>
    :root {
        --color1: #f8f9fa;
    }

    .bgColor {
        background: var(--color1)
    }

    .gallery-img {
        width: 100%;
        height: 250px;
        object-fit: cover;
    }

    .header {
        background-color: #212529;
    }
</style>

<body class="bgColor">
    <div class="container-fluid shadow-lg text-uppercase color1 text-center  text-light p-3">
        <h1 class="text-primary-emphasis">Responsive Image Gallery</h1>
    </div>

    <div class="row g-3 m-2">


        <div class="p-3 col-12 col-sm-6 col-md-4 col-lg-3">
            <img src="https://images.unsplash.com/photo-1704909460172-ed0280e65f54?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                class="img-fluid gallery-img">
        </div>


        <div class="p-3 col-12 col-sm-6 col-md-4 col-lg-3">
            <img src="https://images.unsplash.com/photo-1787224641466-9195e22b85b7?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                class="img-fluid gallery-img">
        </div>

        <div class="p-3 col-12 col-sm-6 col-md-4 col-lg-3">
            <img src="https://images.unsplash.com/photo-1785334012218-a43bcee64525?q=80&w=1172&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                class="img-fluid gallery-img">
        </div>

        <div class="p-3 col-12 col-sm-6 col-md-4 col-lg-3">
            <img src="https://images.unsplash.com/photo-1786813388851-fdb0be9c8d50?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                alt="Coastal road" class="img-fluid gallery-img">
        </div>


        <div class="p-3 col-12 col-sm-6 col-md-4 col-lg-3">
            <img src="https://images.unsplash.com/photo-1714164224467-5910a27103bf?q=80&w=1169&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                class="img-fluid gallery-img">
        </div>

        <div class="p-3 col-12 col-sm-6 col-md-4 col-lg-3">
            <img src="https://images.unsplash.com/photo-1788145653697-13110ecd9388?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                class="img-fluid gallery-img">
        </div>

        <div class="p-3 col-12 col-sm-6 col-md-4 col-lg-3">
            <img src="https://images.unsplash.com/photo-1788987259255-b45d400dd40f?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                class="img-fluid gallery-img">
        </div>

        <div class="p-3 col-12 col-sm-6 col-md-4 col-lg-3">
            <img src="https://images.unsplash.com/photo-1787487283519-ca25e4142eb9?q=80&w=1101&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                class="img-fluid gallery-img">
        </div>



    </div>






    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

</html>
