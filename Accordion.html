<!doctype html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Famous Places in India</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">
</head>
<style>
    body{
    background:#c9795b;
    color:white;
    }
</style>
<body>

    <div class="container mt-5">

        <h2 class="text-center mb-4 text-denger fw-bold">
            Famous Places in India
        </h2>

        <div class="accordion" id="indiaAccordion">


            <!-- Taj Mahal -->

            <div class="accordion-item">

                <h2 class="accordion-header">

                    <button class="accordion-button llapsed"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#tajmahal">

                        Taj Mahal, Agra

                    </button>

                </h2>

                <div id="tajmahal"
                    class="accordion-collapse collapse">

                    <div class="accordion-body text-center">

                        <img src="https://images.unsplash.com/photo-1564507592333-c60657eea523?auto=format&fit=crop&w=900&q=80"
                            class="img-fluid rounded"
                            alt="Taj Mahal">

                    </div>

                </div>

            </div>


            <!-- India Gate -->

            <div class="accordion-item">

                <h2 class="accordion-header">

                    <button class="accordion-button collapsed"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#indiagate">

                        India Gate, Delhi

                    </button>

                </h2>

                <div id="indiagate"
                    class="accordion-collapse collapse">

                    <div class="accordion-body text-center">

                        <img src="https://images.unsplash.com/photo-1587474260584-136574528ed5?auto=format&fit=crop&w=900&q=80"
                            class="img-fluid rounded"
                            alt="India Gate">

                    </div>

                </div>

            </div>


            <!-- Hawa Mahal -->

            <div class="accordion-item">

                <h2 class="accordion-header">

                    <button class="accordion-button collapsed"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#hawamahal">

                        Hawa Mahal, Jaipur

                    </button>

                </h2>

                <div id="hawamahal"
                    class="accordion-collapse collapse">

                    <div class="accordion-body text-center">

                        <img src="https://images.unsplash.com/photo-1599661046289-e31897846e41?auto=format&fit=crop&w=900&q=80"
                            class="img-fluid rounded"
                            alt="Hawa Mahal">

                    </div>

                </div>

            </div>


            <!-- Kerala -->

            <div class="accordion-item">

                <h2 class="accordion-header">

                    <button class="accordion-button collapsed"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#kerala">

                        Kerala Backwaters

                    </button>

                </h2>

                <div id="kerala"
                    class="accordion-collapse collapse">

                    <div class="accordion-body text-center">

                        <img src="https://images.unsplash.com/photo-1602216056096-3b40cc0c9944?auto=format&fit=crop&w=900&q=80"
                            class="img-fluid rounded"
                            alt="Kerala Backwaters">

                    </div>

                </div>

            </div>


        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous">
    </script>

</body>

</html>
